<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unofficial status page for MEGA S4 (S3-compatible object storage) and its IAM API."
    />
    <title>MEGA S4 Status (unofficial)</title>
    <script>
      // Apply persisted theme before first paint to avoid flashing.
      (() => {
        try {
          const q = new URLSearchParams(location.search).get("theme");
          const mode = q || localStorage.getItem("s4status-theme") || "system";
          const dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
