<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unofficial status page for MEGA S4 (S3-compatible object storage) and its IAM API."
    />
    <title>MEGA S4 Status (unofficial)</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEGA S4 Status" />
    <meta property="og:title" content="MEGA S4 Status (unofficial)" />
    <meta
      property="og:description"
      content="Unofficial status monitor for MEGA S4 (S3-compatible object storage) and its IAM API. 28 endpoints × 34 operations, updated every 5 minutes."
    />
    <meta property="og:url" content="https://s4status.sessapps.com/" />
    <meta property="og:image" content="https://s4status.sessapps.com/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MEGA S4 Status — timeline of green, yellow and red status bars" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MEGA S4 Status (unofficial)" />
    <meta
      name="twitter:description"
      content="Unofficial status monitor for MEGA S4 (S3-compatible object storage) and its IAM API."
    />
    <meta name="twitter:image" content="https://s4status.sessapps.com/ogp.png" />
    <script>
      // Apply persisted theme before first paint to avoid flashing.
      (() => {
        try {
          const q = new URLSearchParams(location.search).get("theme");
          const mode = q || localStorage.getItem("s4status-theme") || "system";
          const dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
